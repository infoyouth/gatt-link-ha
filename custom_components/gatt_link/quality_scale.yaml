rules:
  action-setup:
    status: exempt
    comment: The integration does not register Home Assistant actions.
  appropriate-polling: done
  brands:
    status: done
    comment: Custom integrations ship local assets per the current Home Assistant Brands repository guidance.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not provide custom Home Assistant actions.
  docs-conditions:
    status: exempt
    comment: The integration does not provide custom Home Assistant conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration does not provide custom Home Assistant triggers.
  entity-event-setup:
    status: exempt
    comment: The integration creates sensors and does not subscribe to entity events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Devices are discovered by Bluetooth; setup does not collect connection details.
  test-before-setup: done
  unique-config-entry: done
  action-exceptions:
    status: exempt
    comment: The integration does not provide custom Home Assistant actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The integration does not use credentials or authentication.
  test-coverage: done
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: BLE advertisements provide no stable device identifier besides the address.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry represents one fixed Bluetooth device.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices:
    status: exempt
    comment: Each config entry represents one fixed Bluetooth device, removable from Home Assistant.
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The integration uses a BLE-only library and makes no HTTP requests.
  strict-typing: done
