name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.2", "3.15.2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - run: uv sync --locked --dev --python ${{ matrix.python-version }}
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked mypy custom_components tests
      - run: >-
          uv run --locked pytest --cov=custom_components.gatt_link
          --cov-report=term-missing
          --cov-report=json:${{ runner.temp }}/coverage.json --cov-fail-under=95
      - name: Require 95% coverage in every integration module
        env:
          COVERAGE_REPORT: ${{ runner.temp }}/coverage.json
        run: |
          uv run --locked python -c '
          import json, os
          with open(os.environ["COVERAGE_REPORT"], encoding="utf-8") as report_file:
              report = json.load(report_file)
          low_coverage = {
              path: details["summary"]["percent_covered"]
              for path, details in report["files"].items()
              if details["summary"]["percent_covered"] <= 95
          }
          if low_coverage:
              raise SystemExit(f"Integration modules must exceed 95% coverage: {low_coverage}")
          '
