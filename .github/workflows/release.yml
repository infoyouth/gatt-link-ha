name: Release

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Confirm CI checked the current main commit
        id: current-main
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" == "$CI_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI result is stale; main has advanced"
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.current-main.outputs.current == 'true'
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.current-main.outputs.current == 'true'
        with:
          enable-cache: true

      - name: Install locked dependencies
        if: steps.current-main.outputs.current == 'true'
        run: uv sync --locked --dev

      - name: Create GitHub release and tag
        if: steps.current-main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: uv run --with python-semantic-release==10.7.0 --no-project semantic-release version
