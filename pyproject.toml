[project]
name = "gatt-link-ha"
version = "0.2.0"
description = "Home Assistant integration for GATT Link BLE devices."
requires-python = ">=3.14.2"
license = "MIT"
dependencies = ["gatt-link-ble==0.3.1"]

[dependency-groups]
dev = [
    "aiousbwatcher==1.1.2",
    "homeassistant>=2026.3.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "python-semantic-release==10.7.0",
    "ruff>=0.6.0",
    "serialx==1.11.0",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
follow_untyped_imports = true
mypy_path = "."
files = ["custom_components", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["custom_components/gatt_link/manifest.json:version"]
assets = ["uv.lock"]
build_command = "uv lock"
commit_parser = "conventional"
commit_message = "chore(release): {version}"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "^main$"

[tool.semantic_release.commit_parser_options]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.publish]
upload_to_vcs_release = true
